<div class="background py-1 border-top border-secondary">
  <div class="container-fluid">
    <div class="row align-items-center">
      <div class="col-auto bg-primary text-white px-3 py-1 fw-bold fs-6">
        <i class="bi bi-calendar-event me-1"></i> Upcoming Events:
      </div>
      <div class="col">
        <marquee
          behavior="scroll"
          direction="left"
          scrollamount="7"
          class="notice text-white pt-1"
          onmouseover="this.stop();"
          onmouseout="this.start();"
        >
          <ng-container *ngIf="events.length > 0; else defaultEvents">
            <span *ngFor="let ev of events" class="me-5">
              <strong class="text-warning">{{ ev.title }}:</strong>
              <span class="ms-1">Date: {{ ev.date | date:'mediumDate' }} | Location: {{ ev.location }}</span>
              <a routerLink="/events" class="ms-2 badge bg-light text-dark text-decoration-none">Details</a>
            </span>
          </ng-container>
          <ng-template #defaultEvents>
            <span>Annual Sports Day, Science Exhibition, Cultural Fest, and Parents-Teacher Meet coming soon!</span>
          </ng-template>
        </marquee>
      </div>
    </div>
  </div>
</div>
