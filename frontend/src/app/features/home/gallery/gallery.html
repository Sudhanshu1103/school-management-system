<div class="container text py-5">
  <h2 class="fs-2 text-center text-decoration-underline mb-4">Gallery Highlights</h2>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let item of galleries">
      <div class="card shadow-sm h-100 border-0 rounded-3 overflow-hidden">
        <div class="ratio ratio-4x3">
          <img
            [src]="getFirstImage(item.imagesUrl)"
            class="img-fluid object-fit-cover"
            [alt]="item.title"
          />
        </div>
        <div class="card-body text-center p-3">
          <h6 class="card-title fw-bold mb-1">{{ item.title }}</h6>
          <p class="card-text small text-muted">{{ item.date | date:'mediumDate' }}</p>
        </div>
      </div>
    </div>
  </div>
  <div class="text-center mt-4">
    <a routerLink="/gallery" class="btn btn-outline-dark px-4 rounded-pill">View All Moments</a>
  </div>
</div>
