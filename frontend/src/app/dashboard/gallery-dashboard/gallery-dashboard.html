<form class="row g-2 mb-3" (ngSubmit)="save()">
  <input class="form-control col" name="title" [(ngModel)]="form.title" placeholder="Title" required>
  <input class="form-control col" name="date" type="date" [(ngModel)]="form.date">
  <input class="form-control col" name="imagesUrl" [(ngModel)]="form.imagesUrl" placeholder="Image URLs, comma-separated" required>
  <button class="btn btn-primary col-auto" type="submit">{{ editingId ? 'Update' : 'Add' }}</button>
</form>

<table class="table">
  <thead class="table-dark">
    <tr>
      <th class="background">Title</th>
      <th class="background">Event Date</th>
      <th class="background">Photos</th>
      <th class="text-end background">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let gallery of galleries">
      <td>{{ gallery.title }}</td>
      <td>{{ gallery.date | date }}</td>
      <td>
        <img *ngFor="let image of gallery.imagesUrl.split(',')" [src]="image.trim()" [alt]="gallery.title" class="img-thumbnail" width="60" />
      </td>
      <td class="text-end">
        <i
          class="fa fa-pencil me-4"
          data-bs-toggle="modal"
          data-bs-target="#myModal" (click)="edit(gallery)"
        ></i><button class="btn btn-sm btn-outline-danger" (click)="remove(gallery._id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<!-- The Modal -->
<div class="modal fade" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title text text-center">Add/Edit Gallery Event</h4>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
        <form>
          <div class="row">
            <!-- Part 1: Event Details -->
            <div class="col-md-12">
              <div class="mb-3">
                <label for="eventTitle" class="form-label">Event Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="eventTitle"
                  placeholder="Enter event title"
                />
              </div>
              <div class="mb-3">
                <label for="eventDate" class="form-label">Event Date</label>
                <input type="date" class="form-control" id="eventDate" />
              </div>
              <div class="mb-3">
                <label for="location" class="form-label"
                  >Image URLs (comma-separated)</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="images"
                  placeholder="Enter image URLs"
                />
              </div>
            </div>
          </div>
        </form>
        <!-- Modal footer -->
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-danger background btn-sm"
            data-bs-dismiss="modal"
          >
            Submit
          </button>
          <button
            type="button"
            class="btn btn-danger btn-sm"
            data-bs-dismiss="modal"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
