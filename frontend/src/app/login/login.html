<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0 rounded-4 overflow-hidden">
        <div class="card-header background text-white text-center py-4">
          <img src="assets/images/logo.jpeg" class="rounded-circle border border-white mb-2" width="65" height="65">
          <h3 class="fw-bold mb-0">Administrator Portal</h3>
          <span class="small text-light">God Grace School Management</span>
        </div>
        <div class="card-body p-4 p-md-5">
          <div *ngIf="errorMessage" class="alert alert-danger py-2 small">
            {{ errorMessage }}
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input
                  type="email"
                  class="form-control"
                  formControlName="email"
                  placeholder="Enter email address"
                />
              </div>
              <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger small mt-1">
                Valid email is required.
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input
                  type="password"
                  class="form-control"
                  formControlName="password"
                  placeholder="Enter password"
                />
              </div>
              <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small mt-1">
                Password is required.
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary background w-100 py-2 rounded-3 fw-bold"
              [disabled]="loading"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              Sign In to Dashboard
            </button>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
